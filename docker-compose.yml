services:
  postgres:
    image: postgres:16-alpine
    container_name: zero-quebra-pg
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: zero_quebra
      POSTGRES_USER: zero_quebra
      POSTGRES_PASSWORD: zero_quebra_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zero_quebra -d zero_quebra"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
